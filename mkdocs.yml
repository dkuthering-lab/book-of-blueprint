site_name: Кодекс созидательного общества
site_url: https://dkuthering-lab.github.io/book-of-blueprint/
repo_url: https://github.com/dkuthering-lab/book-of-blueprint

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - '🇷🇺 Русский':
    - Кодекс:
      - Введение: books/ru/KODEKS/INDEX.md
      - Краткая версия: books/ru/KODEKS/EDITIONS/KODEKS_SHORT.md
      - Полный текст:
        - Преамбула: books/ru/KODEKS/EDITIONS/KODEKS_FULL_01_PREAMBULA.md
        - I. Базовые основания: books/ru/KODEKS/EDITIONS/KODEKS_FULL_02_I_BAZOVYE_OSNOVANIYA.md
        - II. Близкие отношения: books/ru/KODEKS/EDITIONS/KODEKS_FULL_03_II_BLIZKIE_OTNOSHENIYA_I_PRAKTIKI.md
        - III. Общество и институты: books/ru/KODEKS/EDITIONS/KODEKS_FULL_04_III_OBSHCHESTVO_INSTITUTY.md
        - IV. Экономика и технологии: books/ru/KODEKS/EDITIONS/KODEKS_FULL_05_IV_EKONOMIKA_I_TEKHNOLOGII.md
        - V. Свобода и право: books/ru/KODEKS/EDITIONS/KODEKS_FULL_06_V_SVOBODA_PRAVO_SANCTIONS.md
        - VI. Земля и космос: books/ru/KODEKS/EDITIONS/KODEKS_FULL_07_VI_ZEMLYA_I_KOSMOS.md
        - VII. Работа со знанием: books/ru/KODEKS/EDITIONS/KODEKS_FULL_08_VII_RABOTA_SO_ZNANIEM.md
        - VIII. Социальный контракт: books/ru/KODEKS/EDITIONS/KODEKS_FULL_09_VIII_SOCIALNYI_KONTRAKT.md
